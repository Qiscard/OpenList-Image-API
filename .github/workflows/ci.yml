name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile src/openlist_image_api.py src/openlist_tui.py
      - run: python -m unittest discover -s tests -v
      - run: bash -n install.sh
      - run: sha256sum --check SHA256SUMS
      - run: "! grep -q $'\\r' install.sh"
